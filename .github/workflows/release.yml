name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase from the latest tag
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  main-only:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main, not ${GITHUB_REF_NAME}."
          exit 1

  ci:
    needs: main-only
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        run: bash .github/scripts/next-version.sh "${{ inputs.bump }}" >> "$GITHUB_OUTPUT"

      - name: Build universal binary
        run: make package VERSION="${{ steps.version.outputs.tag }}"

      - name: Write release notes
        run: bash .github/scripts/release-notes.sh "${{ steps.version.outputs.previous }}" "${{ steps.version.outputs.tag }}" > dist/notes.md

      # gh creates the tag on this exact commit, so the release and the tag always match.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/sleepless-macos-universal.tar.gz \
            dist/sleepless-macos-universal.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/notes.md
